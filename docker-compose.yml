# Run the whole stack locally:  docker compose up --build
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  server:
    build: ./server
    environment:
      MONGO_URI: mongodb://mongo:27017/medipredict
      CLIENT_URL: http://localhost:3000
    ports: ["5000:5000"]
    depends_on: [mongo]
  client:
    build:
      context: ./client
      args: { VITE_API_URL: http://localhost:5000/api }
    ports: ["3000:80"]
    depends_on: [server]
volumes:
  mongo-data:
